<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Детские мультики</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мультики">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      padding-bottom: 20px;
    }
    header {
      background: #4a90d9;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      user-select: none;
    }
    #player-container {
      width: 100%;
      max-width: 640px;
      margin: 20px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      aspect-ratio: 16/9;
    }
    #player {
      width: 100%;
      height: 100%;
      border: none;
    }
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 0 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
    }
    .video-card:active { transform: scale(0.97); }
    .video-card .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #4a90d9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3em;
      color: white;
    }
    .video-card .title {
      padding: 8px;
      font-size: 0.9em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>Мультики</header>

  <div id="player-container">
    <iframe id="player" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>

  <div id="video-grid"></div>

  <script>
    // ============================================================
    // СЮДА ВСТАВЬТЕ РАЗРЕШЁННЫЕ ВИДЕО (ссылки на VK Video)
    // Формат: { url: 'ссылка', title: 'Название мультика' }
    // Пример ссылки: http://vk.com/video-226802088_456244066
    // ============================================================
    const ALLOWED_VIDEOS = [
      { url: 'http://vk.com/video-226802088_456244066', title: 'Мультик 1' },
      { url: 'http://vk.com/video-226802088_456244060', title: 'Мультик 2' },
      { url: 'http://vk.com/video-226802088_456243973', title: 'Мультик 3' },
      // Добавьте сколько угодно строк
    ];
    // ============================================================

    // Функция извлечения oid и video_id из ссылки VK
    function parseVkVideoUrl(url) {
      // Паттерны: vk.com/video-123456_789012 или vk.com/video?z=video-123456_789012
      const match = url.match(/video(-?\d+)_(\d+)/);
      if (!match) return null;
      return {
        oid: match[1],      // например, "-226802088"
        videoId: match[2]   // например, "456244066"
      };
    }

    // Рендер сетки видео
    function renderGrid() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';
      ALLOWED_VIDEOS.forEach((video, index) => {
        const parsed = parseVkVideoUrl(video.url);
        if (!parsed) return; // пропускаем некорректные ссылки

        const card = document.createElement('div');
        card.className = 'video-card';
        // Вместо превью показываем цветной блок с эмодзи
        card.innerHTML = `
          <div class="thumb">🎬</div>
          <div class="title">${video.title || 'Без названия'}</div>
        `;
        card.addEventListener('click', () => playVideo(parsed.oid, parsed.videoId));
        grid.appendChild(card);
      });
    }

    // Воспроизведение видео
    function playVideo(oid, videoId) {
      const iframe = document.getElementById('player');
      // Формируем URL для встраивания VK Video
      iframe.src = `https://vk.com/video_ext.php?oid=${oid}&id=${videoId}&autoplay=1`;
    }

    // Инициализация
    renderGrid();
  </script>
</body>
</html>
