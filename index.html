<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Детские мультики</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мультики">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #333;
      padding-bottom: 20px;
    }
    header {
      background: #4a90d9;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      user-select: none;
    }
    #player-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 20px auto 10px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      aspect-ratio: 16/9;
    }
    #player {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Прозрачный слой поверх iframe – блокирует клики по логотипу YouTube */
    #player-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 2;
      pointer-events: auto; /* перехватывает все клики, ничего не делая */
    }
    /* Панель управления (вне плеера) */
    #controls-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      max-width: 640px;
      margin: 0 auto;
      padding: 10px;
    }
    .control-btn {
      width: 50px;
      height: 50px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: background 0.2s, transform 0.1s;
    }
    .control-btn:active { transform: scale(0.95); }
    .control-btn:hover { background: #3a7bc8; }
    /* Иконки (можно заменить на SVG при желании) */
    #play-pause-btn::before {
      content: "⏸"; /* по умолчанию пауза, меняется из JS */
    }
    #fullscreen-btn::before {
      content: "⛶";
    }
    #video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
      padding: 0 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    .video-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .video-card:active { transform: scale(0.97); }
    .video-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
    }
    .video-card .title {
      padding: 8px;
      font-size: 0.9em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>Мультики</header>

  <div id="player-container">
    <div id="player"></div>
    <div id="player-overlay"></div>
  </div>

  <!-- Внешняя панель управления -->
  <div id="controls-panel">
    <button id="play-pause-btn" class="control-btn" aria-label="Пауза/воспроизведение"></button>
    <button id="fullscreen-btn" class="control-btn" aria-label="Полноэкранный режим"></button>
  </div>

  <div id="video-grid"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ============================================================
    // СЮДА ВСТАВЬТЕ РАЗРЕШЁННЫЕ ВИДЕО
    // Формат: { id: 'ID_ВИДЕО', title: 'Название' }
    // ============================================================
    const ALLOWED_VIDEOS = [
      { id: 'dQw4w9WgXcQ', title: 'Пример мультика 1' },
      { id: '9bZkp7q19f0', title: 'Пример мультика 2' },
      // Добавьте сколько угодно строк
    ];
    // ============================================================

    let player;
    let pendingVideoId = null;
    const playPauseBtn = document.getElementById('play-pause-btn');

    // Рендер сетки видео
    function renderGrid() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';
      ALLOWED_VIDEOS.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <img src="https://img.youtube.com/vi/${video.id}/mqdefault.jpg" alt="${video.title}">
          <div class="title">${video.title}</div>
        `;
        card.addEventListener('click', () => playVideo(video.id));
        grid.appendChild(card);
      });
    }

    // Воспроизведение выбранного видео
    function playVideo(videoId) {
      if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
        player.playVideo();
      } else {
        pendingVideoId = videoId;
      }
    }

    // Инициализация YouTube API
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        playerVars: {
          controls: 0,        // скрыть все контролы YouTube
          rel: 0,             // не показывать похожие видео в конце
          modestbranding: 1,  // минимальный брендинг
          playsinline: 0,     // <-- ИЗМЕНЕНО: разрешаем полноэкранный режим
          disablekb: 1,       // отключить клавиатуру
          iv_load_policy: 3,  // скрыть аннотации
          fs: 1,              // разрешить полноэкранный режим (для нашей кнопки)
        },
        events: {
          onReady: function(event) {
            if (pendingVideoId) {
              player.loadVideoById(pendingVideoId);
              player.playVideo();
              pendingVideoId = null;
            }
            updatePlayPauseIcon();
          },
          onStateChange: function(event) {
            updatePlayPauseIcon();
          }
        }
      });
    }

    // Обновление иконки Play/Pause в зависимости от состояния плеера
    function updatePlayPauseIcon() {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      // 1 = воспроизводится, 2 = пауза, 0 = завершено, 5 = буфер
      if (state === 1) {
        playPauseBtn.innerHTML = '⏸';
      } else {
        playPauseBtn.innerHTML = '▶';
      }
    }

    // Переключение воспроизведения/паузы
    function togglePlayPause() {
      if (!player || !player.getPlayerState) return;
      const state = player.getPlayerState();
      if (state === 1) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    // Полноэкранный режим через YouTube API
    function toggleFullscreen() {
      if (!player || !player.getIframe) {
        alert('Плеер ещё не готов');
        return;
      }

      try {
        // Пытаемся использовать YouTube API
        if (player.m && typeof player.m.getFullscreen === 'function') {
          player.m.getFullscreen();
          return;
        }
        // Fallback для Safari/iOS
        const iframe = player.getIframe();
        if (iframe.webkitEnterFullscreen) {
          iframe.webkitEnterFullscreen();
          return;
        }
        // Если ничего не сработало – сообщаем
        alert('Полноэкранный режим не поддерживается.');
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }
    }

    // Привязка кнопок
    document.getElementById('play-pause-btn').addEventListener('click', togglePlayPause);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    // Инициализация
    renderGrid();

    // Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
